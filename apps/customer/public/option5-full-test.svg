
<svg width="600" height="160" viewBox="0 0 600 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="finGrad" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="thrustGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="gleamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="600" height="160" rx="16" fill="#090D16"/>

  <!-- Test 1: Full Wordmark with Option 5 at 32px height -->
  <g transform="translate(30, 40)">
    <!-- Option 5 S aligned to 26px height of letters -->
    <g transform="translate(0, 0.5) scale(0.68)">
      <!-- Top Winglet Bar with 45° Chamfer -->
      <path d="M1 6L7 0.5H34L29 6.5H8L1 6Z" fill="url(#finGrad)"/>
      <!-- Upper Vertical Aero-Spine -->
      <path d="M1 6V17L9 21.5V11L4 6H1Z" fill="url(#finGrad)"/>
      <!-- Kinetic Central Thrust Bridge -->
      <path d="M3 17.5L34 17.5L28 24.5L1 24.5L3 17.5Z" fill="url(#thrustGrad)"/>
      <!-- Lower Vertical Aero-Spine -->
      <path d="M34 21V32L26 36.5V26.5L31 21H34Z" fill="url(#finGrad)"/>
      <!-- Bottom Winglet Bar with 45° Chamfer -->
      <path d="M34 32L28 37.5H1L6 31.5H27L34 32Z" fill="url(#finGrad)"/>
      <!-- Four-Point Diamond Cleaning Gleam Beacon -->
      <path d="M31 1.5C31 4 33.5 4 33.5 4C33.5 4 31 4 31 6.5C31 4 28.5 4 28.5 4C28.5 4 31 4 31 1.5Z" fill="url(#gleamGrad)"/>
    </g>

    <!-- Wordmark A N I T A R Y -->
    <g transform="translate(32, 0)" fill="#F8FAFC">
      <!-- Letter A -->
      <g transform="translate(0, 0)">
        <path d="M9.5 2L1 26H5.8L7.6 20.5H14.4L16.2 26H21L12.5 2H9.5ZM11 6.8L13.2 16.2H8.8L11 6.8Z" />
        <path d="M7.6 19H14.4V20.5H7.6V19Z" fill="#10B981" />
      </g>
      <!-- Letter N -->
      <g transform="translate(24, 0)">
        <path d="M0 2H4.4L13.6 18.8V2H18V26H13.6L4.4 9.2V26H0V2Z" />
      </g>
      <!-- Letter I -->
      <g transform="translate(46, 0)">
        <path d="M0 3.5L1.5 2H4.5L6 3.5V24.5L4.5 26H1.5L0 24.5V3.5Z" />
        <circle cx="3" cy="2" r="1.3" fill="#10B981" />
      </g>
      <!-- Letter T -->
      <g transform="translate(56, 0)">
        <path d="M0 4L1.8 2H16.2L18 4V6.5H11.2V26H6.8V6.5H0V4Z" />
      </g>
      <!-- Letter A -->
      <g transform="translate(77, 0)">
        <path d="M9.5 2L1 26H5.8L7.6 20.5H14.4L16.2 26H21L12.5 2H9.5ZM11 6.8L13.2 16.2H8.8L11 6.8Z" />
        <path d="M7.6 19H14.4V20.5H7.6V19Z" fill="#10B981" />
      </g>
      <!-- Letter R -->
      <g transform="translate(101, 0)">
        <path d="M0 2H9.8C13.8 2 16.8 4.6 16.8 8.6C16.8 11.6 14.6 14 11.5 14.8L17 26H12L7.2 15.5H4.4V26H0V2ZM4.4 6.2V11.8H9.5C11.6 11.8 12.8 10.6 12.8 9C12.8 7.4 11.6 6.2 9.5 6.2H4.4Z" />
      </g>
      <!-- Letter Y -->
      <g transform="translate(121, 0)">
        <path d="M0 2L7 13.5V26H11.6V13.5L18.6 2H13.8L9.3 10.2L4.8 2H0Z" />
      </g>
    </g>

    <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#10B981" letter-spacing="0.18em">DOORSTEP RECYCLING</text>
  </g>

  <!-- Standalone Mark at 48x48 -->
  <g transform="translate(480, 40)">
    <g transform="scale(1.2)">
      <path d="M1 6L7 0.5H34L29 6.5H8L1 6Z" fill="url(#finGrad)"/>
      <path d="M1 6V17L9 21.5V11L4 6H1Z" fill="url(#finGrad)"/>
      <path d="M3 17.5L34 17.5L28 24.5L1 24.5L3 17.5Z" fill="url(#thrustGrad)"/>
      <path d="M34 21V32L26 36.5V26.5L31 21H34Z" fill="url(#finGrad)"/>
      <path d="M34 32L28 37.5H1L6 31.5H27L34 32Z" fill="url(#finGrad)"/>
      <path d="M31 1.5C31 4 33.5 4 33.5 4C33.5 4 31 4 31 6.5C31 4 28.5 4 28.5 4C28.5 4 31 4 31 1.5Z" fill="url(#gleamGrad)"/>
    </g>
  </g>
</svg>
